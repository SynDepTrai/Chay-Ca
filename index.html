<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fishing Escape 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07111b;font-family:Arial;color:#fff}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5;text-shadow:0 2px 3px #000}
#top{display:flex;justify-content:space-between;padding:16px;font-size:14px}
.panel{background:#06101dcc;border:1px solid #5d7890;border-radius:10px;padding:10px 14px;backdrop-filter:blur(5px)}
#wanted{color:#ffdd72;font-weight:bold}#alert{color:#ff6b62;font-weight:bold}
#help{position:absolute;bottom:14px;left:14px;line-height:1.5;color:#d7e6ef}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:#fff;opacity:.8}#cross:before{width:2px;height:18px;left:8px}#cross:after{height:2px;width:18px;top:8px}
#barWrap{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:280px;display:none}#bar{height:12px;background:#e85b56;border-radius:10px;width:0;transition:width .1s}
#message{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;display:none;font-size:30px;background:#07111bee;border:2px solid #f5c76c;border-radius:18px;padding:24px 34px;pointer-events:auto}button{margin-top:16px;background:#f5c76c;border:0;border-radius:9px;padding:11px 20px;font-weight:bold;cursor:pointer}
#hint{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);font-size:16px;color:#ffe9a4}
</style></head>
<body>
<div id="ui"><div id="top"><div class="panel">🎣 CẦN CÂU: <span id="rod">ĐANG CẦM</span><br>🏃 Thể lực: <span id="stamina">100</span></div><div class="panel">🚨 Trạng thái: <span id="alert">BÌNH THƯỜNG</span><br>📍 Thoát hiểm: <span id="distance">---</span>m</div></div><div id="barWrap" class="panel">BẢO VỆ ĐANG LẬP BIÊN BẢN<div id="bar"></div></div><div id="cross"></div><div id="hint"></div><div id="help" class="panel">WASD di chuyển · Space nhảy · Shift chạy · E núp trong cây · R reset<br>Đưa cần câu vào vùng xanh ở cuối bản đồ để tẩu thoát.</div><div id="message"><div id="result"></div><button onclick="resetGame()">CHƠI LẠI</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';
import {PointerLockControls} from 'https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/controls/PointerLockControls.js';

let scene,camera,renderer,controls,clock;let player,rod;let guards=[],trees=[],buildings=[],keys={};let hidden=false,caught=false,gameOver=false,report=0,stamina=100;let exitZ=-1550;const WORLD=1800;
const $=id=>document.getElementById(id); const mat=(c)=>new THREE.MeshLambertMaterial({color:c});
function box(x,y,z,sx,sy,sz,c){let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(c));m.position.set(x,y,z);scene.add(m);return m}
function cyl(x,y,z,r,h,c){let m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.9,h,8),mat(c));m.position.set(x,y,z);scene.add(m);return m}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x83b5ce);scene.fog=new THREE.Fog(0x83b5ce,120,1100);camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,2200);camera.position.set(0,2,700);player=camera;renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);controls=new PointerLockControls(camera,document.body);document.body.addEventListener('click',()=>controls.lock());clock=new THREE.Clock();
scene.add(new THREE.HemisphereLight(0xbbe5ff,0x315026,2));let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(100,300,100);sun.castShadow=true;scene.add(sun);
let ground=box(0,-3,0,WORLD,6,WORLD,0x406b3e);ground.receiveShadow=true;createMap();addRod();addEvents();animate()}
function createMap(){for(let i=0;i<90;i++){let x=(Math.random()-.5)*1500,z=(Math.random()-.5)*1450;if(Math.abs(x)<120&&z>400)continue;let w=25+Math.random()*45,d=25+Math.random()*45,h=12+Math.random()*35;let b=box(x,h/2-3,z,w,h,d,[0x9b6b4b,0x647b86,0xb27b54,0x735c82][i%4]);b.castShadow=true;buildings.push(b);box(x,h-2,z-d/2-.4,w*.5,4,1.5,0x30251d);}
for(let i=0;i<150;i++){let x=(Math.random()-.5)*1600,z=-100+Math.random()*1100;if(Math.abs(x)<100&&z>350)continue;let t=cyl(x,10,z,2,20,0x59422e);let crown=new THREE.Mesh(new THREE.ConeGeometry(12,34,8),mat(0x1d5734));crown.position.set(x,25,z);scene.add(crown);trees.push({x,z,r:14});}
let exit=box(0,-2,exitZ,1000,1,180,0x2e9e75);exit.material.transparent=true;exit.material.opacity=.6;for(let x=-450;x<=450;x+=45){box(x,5,exitZ-90,3,10,3,0xe8e1b2)}
for(let i=0;i<3;i++)guards.push(makeGuard(-260+i*260,10,250-i*70));}
function makeGuard(x,y,z){let g=new THREE.Group();g.position.set(x,y,z);let body=new THREE.Mesh(new THREE.BoxGeometry(5,8,3.5),mat(0x2455a5));body.position.y=4;g.add(body);let head=new THREE.Mesh(new THREE.BoxGeometry(4,4,4),mat(0xf0b37e));head.position.y=10;g.add(head);let hat=new THREE.Mesh(new THREE.CylinderGeometry(2.7,2.7,1,8),mat(0x17233f));hat.position.y=12.3;g.add(hat);for(let s of [-1,1]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.25,8,8),mat(0x111111));eye.position.set(s*.8,10.3,-1.95);g.add(eye);let arm=new THREE.Mesh(new THREE.BoxGeometry(1.5,6,1.5),mat(0x2455a5));arm.position.set(s*3,4,0);g.add(arm);let leg=new THREE.Mesh(new THREE.BoxGeometry(1.4,5,1.5),mat(0x1a2637));leg.position.set(s*1.2,-2,0);g.add(leg)}scene.add(g);return {g,speed:2.5,target:null,stunned:0}}
function addRod(){rod=new THREE.Group();let stick=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,3,8),mat(0x70452c));stick.rotation.z=-.35;stick.position.set(.7,-.6,-1.3);rod.add(stick);let reel=new THREE.Mesh(new THREE.TorusGeometry(.22,.05,8,14),mat(0xd8b64b));reel.position.set(.45,-.8,-1.65);reel.rotation.y=Math.PI/2;rod.add(reel);camera.add(rod);scene.add(camera)}
function addEvents(){addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'&&!caught)toggleHide();if(e.code==='KeyR')resetGame()});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}
function toggleHide(){let near=trees.some(t=>Math.hypot(camera.position.x-t.x,camera.position.z-t.z)<16);if(near){hidden=!hidden;$('hint').textContent=hidden?'ĐANG NÚP TRONG CÂY — di chuyển có thể gây tiếng động':'Đã rời khỏi bụi cây';}}
function move(dt){if(gameOver)return;let dir=new THREE.Vector3();if(keys.KeyW)dir.z-=1;if(keys.KeyS)dir.z+=1;if(keys.KeyA)dir.x-=1;if(keys.KeyD)dir.x+=1;if(dir.length()){dir.normalize();let speed=keys.ShiftLeft&&stamina>0?13:7;if(keys.ShiftLeft)stamina=Math.max(0,stamina-25*dt);else stamina=Math.min(100,stamina+15*dt);if(hidden&&Math.random()<dt*.8){hidden=false;$('hint').textContent='Bạn gây tiếng động!';}controls.moveRight(dir.x*speed*dt);controls.moveForward(dir.z*speed*dt)}else stamina=Math.min(100,stamina+20*dt);if(keys.Space&&camera.position.y<=2.01)camera.position.y=9;else camera.position.y=Math.max(2,camera.position.y-25*dt);camera.position.x=THREE.MathUtils.clamp(camera.position.x,-820,820);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-850,850)}
function ai(dt){if(caught)return;let nearest=9999;guards.forEach(g=>{let d=g.g.position.distanceTo(camera.position);nearest=Math.min(nearest,d);if(g.stunned>0){g.stunned-=dt;return}if(!hidden||d<16){g.target=camera.position.clone();let v=g.target.sub(g.g.position);v.y=0;if(v.length()>9){v.normalize();g.g.position.addScaledVector(v,g.speed*dt);g.g.lookAt(camera.position.x,g.g.position.y,camera.position.z)}}if(d<10){caught=true;rod.visible=false;$('rod').textContent='RƠI DƯỚI ĐẤT';$('barWrap').style.display='block';guards.forEach(q=>q.stunned=7)}});$('alert').textContent=nearest<90?'BỊ PHÁT HIỆN!':'BÌNH THƯỜNG';$('alert').style.color=nearest<90?'#ff6b62':'#9effa6';if(caught){report+=dt/12*100;$('bar').style.width=Math.min(100,report)+'%';if(report>=100)end('THUA CUỘC','Biên bản đã hoàn tất.');if(camera.position.distanceTo(guards[0].g.position)>20){rod.visible=true;rod.position.set(0,-.5,-1);caught=false;report=0;$('barWrap').style.display='none';$('rod').textContent='ĐANG CẦM'}}}
function animate(){requestAnimationFrame(animate);let dt=Math.min(.04,clock.getDelta());move(dt);ai(dt);let d=Math.max(0,Math.abs(camera.position.z-exitZ));$('distance').textContent=Math.round(d);$('stamina').textContent=Math.round(stamina);if(camera.position.z<exitZ+90&&rod.visible)end('THẮNG!','Bạn đã tẩu thoát thành công với cần câu.');renderer.render(scene,camera)}
function end(title,text){gameOver=true;controls.unlock();$('result').innerHTML='<b>'+title+'</b><br><small>'+text+'</small>';$('message').style.display='block'}
window.resetGame=()=>location.reload();init();
</script></body></html>
